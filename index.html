<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werpfährtmich? — Pferdetransport auf Anfrage</title>
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="theme-color" content="#4338CA">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Eigenes Stylesheet mit automatischem Cache-Buster (siehe Script unten) -->
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app" style="display:none"></main>

  <!-- Bibliotheken -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!--
    Automatischer Cache-Buster.
    Lädt styles.css und die vier App-Dateien immer mit einem frischen
    Zeitstempel (?v=...). Dadurch zeigt der Browser nach jeder Änderung
    sofort die neue Version — du musst nie wieder eine Versionsnummer
    von Hand hochzählen. Einfach Dateien auf GitHub hochladen, Seite
    neu laden, fertig.
  -->
  <script>
    (function () {
      var v = Date.now();

      // Stylesheet nachladen
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'styles.css?v=' + v;
      document.head.appendChild(link);

      // App-Dateien der Reihe nach laden (Reihenfolge ist wichtig)
      var files = [
        'js/config.js',
        'js/icons.js',
        'js/api.js',
        'js/app.js'
      ];

      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + '?v=' + v;
        s.onload = function () { next(i + 1); };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
